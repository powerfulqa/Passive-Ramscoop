name: Release

on:
  push:
    tags: ['v*']

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Tag, mod_info.json, Ramscoop.version, download URLs and a dated changelog.txt entry must all agree.
      - name: Check tag matches version files
        run: |
          javac -d build/test-classes src/test/java/ramscoop/RepoCheck.java
          java -cp build/test-classes ramscoop.RepoCheck "$GITHUB_REF_NAME"

      - name: Package
        run: |
          mkdir -p release/Ramscoop
          # Same file list as build.sh --install.
          cp -r jars data mod_info.json Ramscoop.version changelog.txt README.md LICENSE.txt release/Ramscoop/
          (cd release && zip -r "../Ramscoop-$GITHUB_REF_NAME.zip" Ramscoop)
          # Release notes = this version's section of changelog.txt.
          awk -v h="Version ${GITHUB_REF_NAME#v} " '/^Version /{p = index($0, h) == 1} p' changelog.txt > notes.txt
          cat notes.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: Ramscoop ${{ github.ref_name }}
          files: Ramscoop-${{ github.ref_name }}.zip
          body_path: notes.txt
