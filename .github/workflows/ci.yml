name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call: # reused by release.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the jar-age check below
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Settings CSV format and keys vs ModPlugin, version files and download URLs.
      - name: Repo check
        run: |
          javac -d build/test-classes src/test/java/ramscoop/RepoCheck.java
          java -cp build/test-classes ramscoop.RepoCheck

      # The game jars are not public, so CI cannot compile the mod. Instead check the
      # committed jar has a class for every source file, built for Java 17 (class version 61).
      - name: Committed jar matches sources
        run: |
          for src in src/ramscoop/*.java; do
            cls="ramscoop/$(basename "$src" .java).class"
            unzip -l jars/Ramscoop.jar "$cls" > /dev/null || { echo "::error::$cls missing from jars/Ramscoop.jar"; exit 1; }
            major=$(unzip -p jars/Ramscoop.jar "$cls" | od -An -j6 -N2 -tu1 | awk '{print $1*256+$2}')
            [ "$major" = 61 ] || { echo "::error::$cls is class version $major, expected 61 (Java 17)"; exit 1; }
          done
          # Warn if a source changed in a later commit than the jar.
          if [ "$(git log -1 --format=%ct -- src/ramscoop)" -gt "$(git log -1 --format=%ct -- jars/Ramscoop.jar)" ]; then
            echo "::warning::src/ramscoop was committed after jars/Ramscoop.jar; rebuild with build.sh or build.ps1"
          fi
